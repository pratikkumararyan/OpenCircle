<!DOCTYPE html>
<html lang="en">
    <head>
        <title>OpenCircle | Dashboard</title>
        <meta charset="UTF-8" />
        <meta name="description"
              content="OpenCircle | An open-source Django social media platform for the specially abled. Made with lub by some random sigma from India" />
        <meta name="keywords"
              content="Open-source, Django, social media, Specially abled, Modern UI" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5"
              rel="stylesheet"
              type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
              rel="stylesheet"
              type="text/css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
        <link href="https://fonts.googleapis.com" rel="stylesheet" />
        <style type="text/css">
            @theme {
                --font-heading: "Montserrat", sans-serif;
                --font-body: "Inter", sans-serif;
                --font-mono: "JetBrains Mono", monospace;
                --font-serif: "Playfair Display", serif;
                --font-sans: InterVariable, sans-serif;
                --font-sans--font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
            }
        </style>
    </head>
    <body hx-boost="True">
        <div class="flex place-items-center justify-center my-4">
            <p class="text-3xl tracking-wide">Welcome back!</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 place-items-center justify-center">
            <div class="grid-item">
                <div class="bg-base-300 w-auto h-auto">
                    <div class="card">hi</div>
                </div>
            </div>
            <div class="grid-item">
                <div class="bg-base-300 w-auto h-auto">
                    <div class="card">yo</div>
                </div>
            </div>
        </div>
        <div class="fab fab-flower m-4">
            
                <label tabindex="0" role="button" class="swap swap-rotate">
                    <input type="checkbox" />
                    
                    <svg class="swap-off fill-current"
                         xmlns="http://www.w3.org/2000/svg"
                         width="32"
                         height="32"
                         viewBox="0 0 512 512">
                        <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
                    </svg>
                    <svg class="swap-on fill-current"
                         xmlns="http://www.w3.org/2000/svg"
                         width="32"
                         height="32"
                         viewBox="0 0 512 512">
                        <polygon points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
                    </svg>
                </label>
            <button class="btn btn-circle btn-xl">
                <svg aria-label="New camera photo"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 16 16"
                     fill="currentColor"
                     class="size-6">
                    <path d="M9.5 8.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                    <path fill-rule="evenodd" d="M2.5 5A1.5 1.5 0 0 0 1 6.5v5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 13.5 5h-.879a1.5 1.5 0 0 1-1.06-.44l-1.122-1.12A1.5 1.5 0 0 0 9.38 3H6.62a1.5 1.5 0 0 0-1.06.44L4.439 4.56A1.5 1.5 0 0 1 3.38 5H2.5ZM11 8.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" clip-rule="evenodd" />
                </svg>
            </button>
            <button class="btn btn-circle btn-xl">
                <svg aria-label="New poll"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 16 16"
                     fill="currentColor"
                     class="size-6">
                    <path d="M3 4.75a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM6.25 3a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5h-7ZM6.25 7.25a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5h-7ZM6.25 11.5a.75.75 0 0 0 0 1.5h7a.75.75 0 0 0 0-1.5h-7ZM4 12.25a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM3 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" />
                </svg>
            </button>
            <button class="btn btn-circle btn-xl">
                <svg aria-label="New gallery photo"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 16 16"
                     fill="currentColor"
                     class="size-6">
                    <path fill-rule="evenodd" d="M2 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4Zm10.5 5.707a.5.5 0 0 0-.146-.353l-1-1a.5.5 0 0 0-.708 0L9.354 9.646a.5.5 0 0 1-.708 0L6.354 7.354a.5.5 0 0 0-.708 0l-2 2a.5.5 0 0 0-.146.353V12a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5V9.707ZM12 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z" clip-rule="evenodd" />
                </svg>
            </button>
            <button class="btn btn-circle btn-xl">
                <svg aria-label="New voice"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 16 16"
                     fill="currentColor"
                     class="size-6">
                    <path d="M8 1a2 2 0 0 0-2 2v4a2 2 0 1 0 4 0V3a2 2 0 0 0-2-2Z" />
                    <path d="M4.5 7A.75.75 0 0 0 3 7a5.001 5.001 0 0 0 4.25 4.944V13.5h-1.5a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 0 0-1.5h-1.5v-1.556A5.001 5.001 0 0 0 13 7a.75.75 0 0 0-1.5 0 3.5 3.5 0 1 1-7 0Z" />
                </svg>
            </button>
        </div>
    </body>
</html>
