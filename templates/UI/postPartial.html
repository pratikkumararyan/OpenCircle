<article class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 md:p-6 shadow-xl space-y-4 w-full">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="avatar">
                <div class="w-10 h-10 rounded-full">
                    <a href="profile/{{ post.poster.pk }}">
                        <img src="{{ post.poster.profile.profile_picture.url }}"
                             alt="{{ post.poster.username }}" />
                    </a>
                </div>
            </div>
            <div>
                <h3 class="font-bold text-sm md:text-base leading-none text-slate-100">
                    <a href="profile/{{ post.poster.pk }}">{{ post.poster.username }}</a>
                </h3>
                <span class="text-xs text-slate-400">{{ post.timestamp|timesince }} ago</span>
            </div>
        </div>
        <button class="btn btn-ghost btn-circle btn-sm hover:text-error speakchild">
            <label class="hidden">{{ post.content|safe }}</label>
            <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Speaker icon">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
        </button>
    </div>
    
<div class="post-content text-sm md:text-base text-slate-300 leading-relaxed break-words whitespace-pre-wrap overflow-hidden">{{ post.content|safe }}</div>
    {% if post.image %}
        <div class="w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-700/30 flex items-center justify-center max-h-[550px]">
            <img src="{{ post.image.url }}"
                 class="w-full h-full object-cover"
                 alt="Post media" />
        </div>
    {% endif %}
    <input value="{{ Id }}" id="field{{ Id }}" hidden name="post{{ Id }}" />
</article>
<div hx-get="feed/{{ Id }}"
     hx-include="#field{{ Id }}"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     class="text-center py-4">
    <span class="loading loading-spinner loading-md text-indigo-400"></span>
</div>
