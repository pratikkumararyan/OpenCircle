{% load static %}
<p class="font-mono py-2 text-6xl text-[#F4F4F9] tracking-wide">Login</p>
<div class="fieldset flex-1 border-base-300 rounded-box w-full border p-4">
  <form hx-post="{% url "authenticate" %}" hx-swap="#errors">
    {% csrf_token %}
    <div class="w-full text-left pb-2">
      <label class="label tracking-xl text-[#F4F4F9]">Email / Username</label>
    </div>
    <input class="input w-full" placeholder="john@doe" required id="username" name="username"/>
    <div class="w-full text-left py-2">
      <label class="label tracking-xl text-[#F4F4F9] mr-2">Password</label>
    </div>
    <div class="join w-full flex">
      <input type="password"
             class="input join-item w-full"
             placeholder="1234"
             id="passInput"
             name="passInput"
             required />
      <div class="join-item btn btn-accent flex items-center justify-center tooltip tooltip-top md:tooltip-bottom"
           id="passToggle"
           onclick="passwordToggle()"
           data-tip="Toggle password">
        <img src="{% static "eye-slash.svg" %}"
             id="passwordEmoji"
             class="h-6"
             alt="passwordToggle" />
      </div>
    </div>
    <div class="w-full">
      <button class="btn border-[#EF7B45] hover:bg-[#EF7B45] hover:text-[#000000] active:scale-90 transition-all w-full mt-4"
              type="submit">Login</button>
    </div>
  </form>
  <div class="divider divider-accent">OR</div>
  <form hx-post="{% url "authenticate" %}" >
    <input type="email" class="hidden" value="guest@guest.com"/>
    <input type="password" class="hidden" value="abcd"/>
    
    <button class="bg-gradient-to-br from-white/20 to-white/5 backdrop-blur-200 glass shadow-6xl border border-neutral-content/20 tooltip tooltip-top md:tooltip-bottom hover:-translate-y-1 transition-all duration-300 border-5 border-neutral-content rounded-3xl flex flex-row items-center justify-start gap-6 py-2 w-full hover:border-primary cursor-pointer"
            type="submit"
            data-tip="NOTE: This is only for testing purposes and not meant for actual production use.">
      <svg xmlns="http://www.w3.org/2000/svg"
           class="w-10 h-10 ml-2 p-1"
           fill="currentColor"
           class="bi bi-person"
           viewBox="0 0 16 16">
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
      </svg>
      <p class="text-xl text-neutral-content tracking-widest font-body items-center place-items-center">Login as Guest</p>
    </button>
  </form>
</div>
<div class="flex flex-row w-full">
  <button hx-get="{% url "signup" %}" hx-target="#authentication" hx-trigger="click"
     class="link link-hover ml-auto text-lg text-neutral-content leading-10 hover:text-accent">New? Signup instead!</button>
</div>
